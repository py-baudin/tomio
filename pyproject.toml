[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tomio"
version = "0.1.1"
description = "I/O utilities for medical images: image volumes with geometry, interpolation, label and config files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pierre-Yves Baudin" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml",
    "SimpleITK",
]
keywords = ["medical imaging", "nifti", "itk", "simpleitk", "volume", "interpolation", "itk-snap", "labels"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
interp = ["scipy"]
nibabel = ["nibabel"]
test = ["pytest", "scipy", "nibabel"]

[project.scripts]
tomio = "tomio.cli:main"

[project.urls]
Homepage = "https://github.com/py-baudin/tomio"
Repository = "https://github.com/py-baudin/tomio"
Issues = "https://github.com/py-baudin/tomio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
